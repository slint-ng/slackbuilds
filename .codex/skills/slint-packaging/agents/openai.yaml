interface:
  display_name: "Slint Packaging"
  short_description: "SlackBuild/SLKBUILD maintenance for Slint"
  default_prompt: "Follow Slint SlackBuild/SLKBUILD conventions; run conversion gates (`bash -n`, slackdesc <=70 chars/<=10 lines, no PKGBUILD markers), use HTTPS release tarballs with verifiable provenance (no git/VCS sources unless explicitly approved), preserve baseline behavior, and follow bd landing workflow (`bd sync`, validation beads for conversion/update work)."
